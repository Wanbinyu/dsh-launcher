name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/DshLauncher/DshLauncher.csproj -c Release --nologo
      - name: Unit tests
        run: dotnet run --project tests/DshLauncher.Tests/DshLauncher.Tests.csproj -c Release
      - name: Smoke test
        shell: powershell
        run: ./tests/smoke.ps1
